[tool.poetry]
name = "labed"
version = "0.1.0"
description = "Labeling Dataset Editor — dataset processing tools"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
PyQt5 = "~5.15.10"
pyqtdarktheme = "~2.1.0"
numpy = "~1.26.4"
ujson = "~5.9.0"
shapely = "~2.0.4"
opencv-python-headless = "~4.9.0.80"
rasterio = "~1.3.10"
pillow = "~10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
